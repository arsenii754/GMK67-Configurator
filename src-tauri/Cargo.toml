[package]
name = "gmk67-configurator"
version = "1.0.0"
description = "VIA-style Desktop Configurator for Zuoya GMK67"
authors = ["GMK67"]
edition = "2021"

[lib]
name = "gmk67_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = "2.6"

